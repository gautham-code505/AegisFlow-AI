[pytest]
testpaths =
    tests

filterwarnings =
    # PyTorch CUDA detection warning: environmental (WSL2 driver version).
    # No GPU is used by AegisFlow; PyTorch falls back to CPU safely.
    # While -W error from CLI will override this, we maintain it here for normal test runs.
    ignore:.*CUDA initialization.*:UserWarning

    # --- Intentional AegisFlow deprecation warnings: explicitly tested ---
    # The legacy 4-approach video/image APIs are intentionally deprecated.
    # Tests in test_legacy_deprecation.py and test_concurrency.py verify this behavior
    # and contain specific @pytest.mark.filterwarnings to allow them during -W error.
    ignore:.*The 4-approach video upload API is deprecated.*:DeprecationWarning
    ignore:.*The 4-approach image upload API is deprecated.*:DeprecationWarning
